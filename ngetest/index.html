<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu</title>
  <style>
    .menu-toggle {
      width: 30px;
      height: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      height: 4px;
      background-color: #333;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<!-- Hamburger icon -->
<div class="menu-toggle">
  <span></span>
  <span></span>
  <span></span>
</div>

</body>
</html>
